<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="devgiz-grad-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="devgiz-glow-mark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon -->
  <path d="M50 5 L89 27.5 V72.5 L50 95 L11 72.5 V27.5 L50 5Z" stroke="#1E293B" stroke-width="2" fill="#090D16" />
  
  <!-- Constellation Lines -->
  <path d="M50 5 V95 M11 27.5 L89 72.5 M11 72.5 L89 27.5" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" />
  
  <!-- Vertex Constellation Dots -->
  <circle cx="50" cy="5" r="1.8" fill="#38BDF8" opacity="0.6" />
  <circle cx="89" cy="27.5" r="1.8" fill="#38BDF8" opacity="0.6" />
  <circle cx="89" cy="72.5" r="1.8" fill="#38BDF8" opacity="0.6" />
  <circle cx="50" cy="95" r="1.8" fill="#38BDF8" opacity="0.6" />
  <circle cx="11" cy="72.5" r="1.8" fill="#38BDF8" opacity="0.6" />
  <circle cx="11" cy="27.5" r="1.8" fill="#38BDF8" opacity="0.6" />
  
  <!-- Inner Shield Contour with Electric Gradient -->
  <path d="M50 12 L82 30 V70 L50 88 C50 88 22 72 22 50 C22 28 50 12 50 12Z" stroke="url(#devgiz-grad-mark)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Triangular Pointer Tail at bottom right -->
  <polygon points="73,76 89,84 71,86" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" fill="#090D16" />
  
  <!-- Central Geometric Glyph -->
  <path d="M45 35 H65 V65 H35 V50 H58" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Glowing Node at center-right of glyph -->
  <circle cx="55" cy="50" r="3.5" fill="#38BDF8" filter="url(#devgiz-glow-mark)" />
</svg>