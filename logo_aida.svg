<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdd26e"/>
      <stop offset="45%" stop-color="#d49a37"/>
      <stop offset="100%" stop-color="#aa741f"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#071527"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring (Cartographic Compass & Spatial Meridian) -->
  <circle cx="50" cy="50" r="46" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2, 2.5" opacity="0.7"/>

  <!-- Cardinal Compass Coordinates Ticks -->
  <line x1="50" y1="4" x2="50" y2="9.5" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="50" y1="90.5" x2="50" y2="96" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="4" y1="50" x2="9.5" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="90.5" y1="50" x2="96" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Spatial Grid Contours / Urban-Rural Interface Curves -->
  <path d="M 18 58 Q 38 42, 50 50 T 82 44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.35"/>
  <path d="M 22 66 Q 42 54, 52 60 T 78 56" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25"/>

  <!-- Monogram Mark: A & P Interlaced -->
  <!-- Letter A -->
  <path d="M 40 25 L 26 73 L 34 73 L 38 60 L 52 60 L 53.5 54 L 40 54 L 45.5 37 L 49.5 50 L 55 50 Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Letter P (Interlaced seamlessly with right apex) -->
  <path d="M 49 25 L 49 73 L 57 73 L 57 53 L 65 53 C 74 53, 79 48, 79 39 C 79 30, 73 25, 64 25 Z M 57 32 L 63.5 32 C 68.5 32, 71 34.5, 71 39 C 71 43.5, 68.5 46, 63.5 46 L 57 46 Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Central North Star Point -->
  <circle cx="50" cy="14" r="1.4" fill="#ffffff"/>
</svg>
